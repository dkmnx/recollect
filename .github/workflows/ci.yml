name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -count=1
      - name: Run race tests
        run: go test -race ./... -count=1
      - name: Cross-build linux/amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Cross-build windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Run test audit check
        run: go run ./tools/checktestaudit
      - name: Check install placeholders
        run: |
          test -f README.md
          test -f adapters/opencode/README.md
          test -f adapters/dsh/README.md
          if grep -En 'opencode-recollect@v?[0-9]' README.md adapters/opencode/README.md; then
            echo 'Use opencode-recollect@latest in install examples.'
            exit 1
          fi
          if grep -En 'dsh-recollect@v?[0-9]' README.md adapters/dsh/README.md; then
            echo 'Use dsh-recollect@latest in install examples.'
            exit 1
          fi

  go-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -count=1
      - name: Install MSYS2 MINGW64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Run race tests with CGO_ENABLED=1 and MSYS2 MINGW64 gcc
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  go-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -count=1
      - name: Run race tests
        run: go test -race ./... -count=1

  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install adapter dependencies
        run: bun install --frozen-lockfile
      # shortcut: typecheck covers the changed modules; widen when the adapter is type-clean.
      - name: Typecheck changed adapter modules
        run: bun run typecheck
      - name: Run adapter tests
        run: bun test

  adapter-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install adapter dependencies
        run: bun install --frozen-lockfile
      # shortcut: typecheck covers the changed modules; widen when the adapter is type-clean.
      - name: Typecheck changed adapter modules
        run: bun run typecheck
      - name: Run adapter tests
        run: bun test

  adapter-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install adapter dependencies
        run: bun install --frozen-lockfile
      # shortcut: typecheck covers the changed modules; widen when the adapter is type-clean.
      - name: Typecheck changed adapter modules
        run: bun run typecheck
      - name: Run adapter tests
        run: bun test

  dsh-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and install recollect
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install ./cmd/recollect
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DSH adapter verifier
        env:
          RECOLLECT_BINARY: ${{ runner.temp }}/bin/recollect
        run: node adapters/dsh/verify.mjs adapters/dsh
      - name: Check DSH npm package contents
        run: npm publish --dry-run --ignore-scripts
        working-directory: adapters/dsh

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install staticcheck v0.8.2
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Install govulncheck v1.10.0
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Run govulncheck
        run: govulncheck ./...
